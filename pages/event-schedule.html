<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TRAN TRADING LAB | 금융 데이터</title>
    <meta name="description" content="TRAN TRADING LAB — 실시간 금융 데이터, 경제 일정" />

    <meta property="og:title" content="TRAN TRADING LAB | 금융 데이터" />
    <meta property="og:description" content="실시간 금융 데이터와 경제 일정을 한 눈에 확인하세요." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tran-trading-lab.vercel.app/" />
    <meta property="og:image" content="https://tran-trading-lab.vercel.app/logo.png" />
    <meta property="og:locale" content="ko_KR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TRAN TRADING LAB | 금융 데이터" />
    <meta name="twitter:description" content="실시간 금융 데이터와 경제 일정을 한 눈에 확인하세요." />
    <meta name="twitter:image" content="https://tran-trading-lab.vercel.app/logo.png" />

    <meta name="theme-color" content="#0a0b0e" />
    <meta name="robots" content="index,follow" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://tran-trading-lab.vercel.app/" />
    <link rel="stylesheet" href="/styles/global.css" />

    <style>
      /* 今日事件板块样式 */
      .event-schedule { padding:16px; border:1px solid #222; border-radius:12px; background:#0a0b0ee6; backdrop-filter:blur(2px) }
      .event-schedule h3 { margin:0 0 10px; font-size:1.05rem; letter-spacing:.2px }
      .event-schedule ul { list-style:none; padding:0; margin:0 }
      .event-schedule li { margin:8px 0; line-height:1.45 }
      .event-schedule small { opacity:.7 }
      .event-schedule .time { font-weight:bold; margin-right:10px; }
      .event-schedule .impact { color: orange; }
      .event-schedule .actual { font-weight: bold; }
      .event-schedule .forecast { color: #00b894; }
      .event-schedule .previous { color: #ff7675; }

      /* 顶部价格滚动条（黑色背景） */
      #price-tape {
        position: sticky;
        top: 0;
        z-index: 10000;
        background: #000;
        border-bottom: 1px solid #151515;
      }
      #price-tape .tradingview-widget-container {
        max-width: 100%;
      }
    </style>
  </head>

  <body>
    <a href="#app" class="skip-link">Skip to main content</a>

    <!-- 背景效果画布 -->
    <canvas id="bgfx" data-enabled="true" aria-hidden="true"></canvas>

    <!-- 顶部轮播价格条（TradingView Ticker Tape） -->
    <div id="price-tape" aria-label="가격 티커">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
          {
            "symbols": [
              { "proName": "FX_IDC:USDKRW",   "title": "USD/KRW" },
              { "proName": "OANDA:USDCAD",    "title": "USD/CAD" },
              { "proName": "OANDA:AUDUSD",    "title": "AUD/USD" },
              { "proName": "OANDA:XAUUSD",    "title": "XAU/USD" },
              { "proName": "BINANCE:BTCUSDT", "title": "BTC/USDT" },
              { "proName": "FOREXCOM:SPXUSD", "title": "S&P 500" },
              { "proName": "FOREXCOM:NSXUSD", "title": "Nasdaq 100" }
            ],
            "showSymbolLogo": true,
            "isTransparent": true,
            "displayMode": "adaptive",
            "colorTheme": "dark",
            "locale": "ko"
          }
        </script>
      </div>
    </div>

    <!-- 顶部导航 -->
    <nav class="nav" aria-label="Primary">
      <a href="#/" class="brand" aria-label="홈으로">
        <img src="/logo.png" alt="TRAN Trading Lab" class="logo" />
        TRAN TRADING LAB
      </a>
      <a href="#/daily-brief">데일리 브리프</a>
      <a href="#/trade-journal">분석 아카이브</a>
      <a href="#/knowledge-lab">지식 연구소</a>
      <a href="#/market-news">마켓 뉴스</a>
      <a href="#/articles">아티클</a>
      <a href="#/about">About</a>
    </nav>

    <!-- 今日事件板块 -->
    <section class="ttl-page">
      <h2>오늘의 금융事件</h2>
      <div class="event-schedule">
        <h3>오늘의 주요 일정</h3>
        <ul>
          <li>
            <span class="time">09:30</span>
            <span class="impact">중</span>
            <span>중국 소비자 물가 상승률 MoM</span>
            <span class="actual">0.2%</span> <span class="forecast">0.1%</span> <span class="previous">0.1%</span>
          </li>
          <li>
            <span class="time">10:30</span>
            <span class="impact">고</span>
            <span>미국 소매 판매 지수</span>
            <span class="actual">-0.3%</span> <span class="forecast">-0.2%</span> <span class="previous">0.2%</span>
          </li>
        </ul>
      </div>
    </section>

    <!-- SPA 主要内容 -->
    <main class="container" id="app" aria-live="polite"></main>

    <!-- 新闻流渲染脚本 -->
    <script>
      const NEWS_URL = '/api/news';
      const TG_CHANNEL = ''; // 可选: 'https://t.me/yourchannel'

      async function loadNews() {
        try {
          const r = await fetch(NEWS_URL + '?_=' + Date.now(), { cache: 'no-store' });
          if (!r.ok) throw 0;
          return await r.json();
        } catch { return []; }
      }

      async function renderHomeNews() {
        const box = document.getElementById('ttl-home-news-list');
        if (!box) return;
        box.innerHTML = '<li class="ttl-muted">로딩중…</li>';
        const list = await loadNews();
        if (!list.length) { box.innerHTML = '<li class="ttl-muted">뉴스를 불러올 수 없습니다.</li>'; return; }
        box.innerHTML = '';
        list.slice(0, 10).forEach(n => {
          const d = new Date(n.isoDate || n.ts || Date.now());
          const when = d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
          const li = document.createElement('li');
          li.innerHTML = `<b>[${when}]</b> ${n.summaryKo} <a href="${n.link}" target="_blank" rel="noreferrer">원문</a>`;
          box.appendChild(li);
        });
      }

      async function renderRoute() {
        const hash = location.hash || '#/';
        if (hash.startsWith('#/market-news')) {
          const app = document.getElementById('app');
          if (!app) return;
          app.innerHTML = `
            <section class="ttl-page">
              <h2>마켓 뉴스</h2>
              <p class="ttl-muted">30분마다 업데이트 · 출처 링크 포함</p>
              <div class="ttl-grid">
                <div class="ttl-news">
                  <h3>실시간 스트림</h3>
                  <ul id="ttl-route-news"></ul>
                </div>
                <div class="ttl-news">
                  <h3>공지</h3>
                  <p class="ttl-muted">투자 자문이 아닙니다. 숫자와 시간은 지연/오류가 있을 수 있어 “~ / 대략” 표기를 사용합니다.</p>
                  ${TG_CHANNEL ? `<p><a href="${TG_CHANNEL}" target="_blank">📌 TG에서 실시간 보기</a></p>` : ''}
                </div>
              </div>
            </section>
          `;
          const ul = document.getElementById('ttl-route-news');
          ul.innerHTML = '<li class="ttl-muted">로딩중…</li>';
          const list = await loadNews();
          if (!list.length) { ul.innerHTML = '<li class="ttl-muted">뉴스를 불러올 수 없습니다.</li>'; return; }
          ul.innerHTML = '';
          list.slice(0, 30).forEach(n => {
            const d = new Date(n.isoDate || n.ts || Date.now());
            const when = d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
            const li = document.createElement('li');
            li.innerHTML = `<b>[${when}]</b> ${n.summaryKo} <a href="${n.link}" target="_blank" rel="noreferrer">원문</a>`;
            ul.appendChild(li);
          });
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        renderHomeNews();
        renderRoute();
        setInterval(renderHomeNews, 5 * 60 * 1000);
        window.addEventListener('hashchange', renderRoute);
      });
    </script>

    <!-- 应用脚本 -->
    <script type="module" src="/src/main.js"></script>
    <script src="/js/auto-image.js" defer></script>
  </body>
</html>
