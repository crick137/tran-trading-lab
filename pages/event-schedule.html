    <style>

    <a href="#app" class="skip-link">Skip to main content</a>

    <!-- 背景效果画布 -->
    <canvas id="bgfx" data-enabled="true" aria-hidden="true"></canvas>

    <!-- 顶部轮播价格条（TradingView Ticker Tape） -->
    <div id="price-tape" aria-label="가격 티커">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
          {
            "symbols": [
              { "proName": "FX_IDC:USDKRW",   "title": "USD/KRW" },

            ],

            "isTransparent": true,
            "displayMode": "adaptive",
            "colorTheme": "dark",
            "locale": "ko"
          }
        </script>
      </div>
    </div>

    <!-- 顶部导航 -->

    <!-- 今日行程表和金融数据 -->
    <main class="container" id="app" aria-live="polite">
      <h1>今日行程表和金融数据</h1>

      <!-- 今日行程表 -->
      <section>
        <h2>今日金融数据</h2>
        <table>
          <thead>
            <tr>
              <th>时间</th>
              <th>经济指标</th>
              <th>实际</th>
              <th>预测</th>
              <th>前值</th>
            </tr>
          </thead>
          <tbody id="financial-data">
            <tr><td colspan="5">加载中...</td></tr>
          </tbody>
        </table>
      </section>
    </main>

    <!-- 数据加载脚本 -->
    <script>
      // API 请求 (使用Twelve Data API)
      const API_URL = "https://api.twelvedata.com/time_series?symbol=USD/JPY&interval=1min&apikey=5e917b1bbcc44f1b8f8a91e3d9b0d03c"; // 这里的API密钥是示例，实际使用时需要替换

      async function fetchData() {
        try {
          const response = await fetch(API_URL);
          const data = await response.json();
          console.log(data);

          // 将获取到的数据插入到表格
          const financialDataContainer = document.getElementById('financial-data');
          if (data && data.values) {
            data.values.forEach(item => {
              const row = document.createElement('tr');
              row.innerHTML = `
                <td>${item.datetime}</td>
                <td>USD/JPY</td>
                <td>${item.close}</td>
                <td>-</td>
                <td>-</td>
              `;
              financialDataContainer.appendChild(row);
            });
          }
        } catch (error) {
          console.error('数据加载失败', error);
        }
      }

      document.addEventListener('DOMContentLoaded', fetchData);
    </script>

    <script type="module" src="/src/main.js"></script>
    <script src="/js/auto-image.js" defer></script>
