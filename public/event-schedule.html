<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TRAN TRADING LAB | 시스템 외환 트레이딩 랩</title>
    <meta name="description" content="TRAN TRADING LAB — 데일리 브리프, 분석 아카이브, 지식 연구소, 마켓 뉴스, 아티클" />
    <meta name="theme-color" content="#0a0b0e" />
    <meta name="robots" content="index,follow" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/styles/global.css" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "TRAN TRADING LAB",
      "url": "https://tran-trading-lab.vercel.app/",
      "logo": "https://tran-trading-lab.vercel.app/logo.png",
      "sameAs": []
    }
    </script>
    <style>
      /* 新闻流样式 */
      .ttl-news {
        padding: 16px;
        border: 1px solid #222;
        border-radius: 12px;
        background: #0a0b0ee6;
        backdrop-filter: blur(2px);
      }
      .ttl-news h3 {
        margin: 0 0 10px;
        font-size: 1.05rem;
        letter-spacing: .2px;
      }
      .ttl-news ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .ttl-news li {
        margin: 8px 0;
        line-height: 1.45;
      }
      .ttl-news small {
        opacity: .7;
      }
      .ttl-news a {
        text-decoration: underline;
      }
      .ttl-grid {
        display: grid;
        gap: 16px;
        grid-template-columns: 1fr;
      }
      @media (min-width: 960px) {
        .ttl-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      .ttl-page {
        max-width: 980px;
        margin: 24px auto;
        padding: 0 16px;
      }
      .ttl-page h2 {
        margin: 0 0 12px;
        font-size: 1.25rem;
      }
      .ttl-muted {
        opacity: .6;
      }

      /* 顶部价格滚动条 */
      #price-tape {
        position: sticky;
        top: 0;
        z-index: 10000;
        background: #000;
        border-bottom: 1px solid #151515;
      }
      #price-tape .tradingview-widget-container {
        max-width: 100%;
      }
    </style>
  </head>

  <body>
    <a href="#app" class="skip-link">Skip to main content</a>

    <!-- 背景效果画布 -->
    <canvas id="bgfx" data-enabled="true" aria-hidden="true"></canvas>

    <!-- 顶部轮播价格条（TradingView Ticker Tape） -->
    <div id="price-tape" aria-label="가격 티커">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
        {
          "symbols": [
            { "proName": "FX_IDC:USDKRW", "title": "USD/KRW" },
            { "proName": "OANDA:USDCAD", "title": "USD/CAD" },
            { "proName": "OANDA:AUDUSD", "title": "AUD/USD" },
            { "proName": "OANDA:XAUUSD", "title": "XAU/USD" },
            { "proName": "BINANCE:BTCUSDT", "title": "BTC/USDT" },
            { "proName": "FOREXCOM:SPXUSD", "title": "S&P 500" },
            { "proName": "FOREXCOM:NSXUSD", "title": "Nasdaq 100" }
          ],
          "showSymbolLogo": true,
          "isTransparent": true,
          "displayMode": "adaptive",
          "colorTheme": "dark",
          "locale": "ko"
        }
        </script>
      </div>
    </div>

    <!-- 顶部导航 -->
    <nav class="nav" aria-label="Primary">
      <a href="#/" class="brand" aria-label="홈으로">
        <img src="/logo.png" alt="TRAN Trading Lab" class="logo" />
        TRAN TRADING LAB
      </a>
      <a href="#/daily-brief">데일리 브리프</a>
      <a href="#/trade-journal">분석 아카이브</a>
      <a href="#/knowledge-lab">지식 연구소</a>
      <a href="#/market-news">마켓 뉴스</a>
      <a href="#/articles">아티클</a>
      <a href="event-schedule.html">오늘의 금융 이벤트</a>
      <a href="#/about">About</a>
    </nav>

    <!-- 主要内容 -->
    <main class="container" id="app" aria-live="polite"></main>

    <!-- 数据加载和渲染 -->
    <script>
      const EVENTS_URL = 'https://api.example.com/events';  // 这里替换成实际的API地址

      async function fetchEventsData() {
        try {
          const response = await fetch(EVENTS_URL);
          if (!response.ok) throw new Error('Data not found');
          return await response.json();
        } catch (error) {
          console.error('Error fetching events data:', error);
          return [];
        }
      }

      async function renderEventData() {
        const app = document.getElementById('app');
        const data = await fetchEventsData();

        if (!data.length) {
          app.innerHTML = '<p>加载失败，无法获取数据。</p>';
          return;
        }

        let htmlContent = '<h2>오늘의金融事件</h2><table><thead><tr><th>时间</th><th>经济指标</th><th>实际</th><th>预测</th><th>前值</th></tr></thead><tbody>';
        
        data.forEach(event => {
          htmlContent += `
            <tr>
              <td>${event.time}</td>
              <td>${event.indicator}</td>
              <td>${event.actual}</td>
              <td>${event.forecast}</td>
              <td>${event.previous}</td>
            </tr>
          `;
        });
        htmlContent += '</tbody></table>';
        app.innerHTML = htmlContent;
      }

      document.addEventListener('DOMContentLoaded', () => {
        renderEventData();
      });
    </script>

    <!-- 应用脚本 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
