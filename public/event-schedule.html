<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오늘의 금융 이벤트 | TRAN TRADING LAB</title>
    <meta name="description" content="실시간 경제일정 / 경제지표 캘린더" />
    <meta name="theme-color" content="#0a0b0e" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles/global.css" />
    <style>
      /* 强制整页黑色（即使全局样式未生效也不会变白） */
      html,body{background:#0a0b0e;color:#d5d8df;margin:0}
      a{color:#c2c7d0;text-decoration:none}

      /* 顶部价格滚动条（黑色） */
      #price-tape{position:sticky;top:0;z-index:10000;background:#000;border-bottom:1px solid #151515}
      #price-tape .tradingview-widget-container{max-width:100%}

      /* 简易导航（独立页，避免依赖 SPA） */
      .nav{display:flex;gap:18px;align-items:center;padding:10px 16px;background:#0a0b0e;border-bottom:1px solid #151515}
      .nav .brand{margin-right:auto;display:flex;align-items:center;gap:10px;color:#d5d8df;font-weight:700}
      .nav .logo{height:22px;width:auto;border-radius:4px}
      .nav a[aria-current="page"]{color:#fff}

      /* 页面主体 */
      .ttl-page{max-width:1100px;margin:24px auto;padding:16px}
      .ttl-card{border:1px solid #1c1c1c;background:#0b0c10cc;border-radius:14px;padding:16px}
      .ttl-title{margin:6px 0 12px;font-size:1.35rem}
      .ttl-muted{opacity:.65}
      .widget{min-height:760px}
      .tradingview-widget-container, .tradingview-widget-container__widget{width:100%}

      /* 失败提示/重载 */
      .fail{display:none;margin-top:12px;padding:12px;border:1px dashed #334155;border-radius:10px;background:#0e1117}
      .btn{padding:8px 12px;border:1px solid #334155;border-radius:10px;background:#121826;color:#e7ecf3;cursor:pointer}
      .btn:hover{background:#0f172a}
    </style>
  </head>
  <body>

    <!-- 顶部价格滚动条（TradingView Ticker Tape） -->
    <div id="price-tape" aria-label="가격 티커">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
{
  "symbols": [
    { "proName": "FX_IDC:USDKRW",   "title": "USD/KRW" },
    { "proName": "OANDA:USDCAD",    "title": "USD/CAD" },
    { "proName": "OANDA:AUDUSD",    "title": "AUD/USD" },
    { "proName": "OANDA:XAUUSD",    "title": "XAU/USD" },
    { "proName": "BINANCE:BTCUSDT", "title": "BTC/USDT" },
    { "proName": "FOREXCOM:SPXUSD", "title": "S&P 500" },
    { "proName": "FOREXCOM:NSXUSD", "title": "Nasdaq 100" }
  ],
  "showSymbolLogo": true,
  "isTransparent": true,
  "displayMode": "adaptive",
  "colorTheme": "dark",
  "locale": "ko"
}
        </script>
      </div>
    </div>

    <!-- 顶部导航 -->
    <nav class="nav" aria-label="Primary">
      <a href="/" class="brand" aria-label="홈으로">
        <img src="/logo.png" alt="TRAN Trading Lab" class="logo" />
        TRAN TRADING LAB
      </a>
      <a href="#/daily-brief">데일리 브리프</a>
      <a href="#/trade-journal">분석 아카이브</a>
      <a href="#/knowledge-lab">지식 연구소</a>
      <a href="#/market-news">마켓 뉴스</a>
      <a href="#/articles">아티클</a>
      <a href="/event-schedule.html" aria-current="page">오늘의 금융 이벤트</a>
      <a href="#/about">About</a>
    </nav>

    <!-- 页面主体：仅 TradingView 经济日历 -->
    <main class="ttl-page">
      <section class="ttl-card">
        <h2 class="ttl-title">오늘의 금융 이벤트 <span class="ttl-muted">· 실시간 달력</span></h2>

        <div class="tradingview-widget-container widget" id="tv-box">
          <div class="tradingview-widget-container__widget"></div>
          <script id="tv-script" type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>
{
  "width": "100%",
  "height": "760",
  "colorTheme": "dark",
  "isTransparent": true,
  "locale": "ko"
}
          </script>
        </div>

        <div id="tv-fail" class="fail">
          <div style="margin-bottom:8px">加载受阻（可能被浏览器扩展/隐私设置拦截）。</div>
          <button class="btn" id="btn-retry">重新加载</button>
          <span class="ttl-muted" style="margin-left:8px">若仍失败，可尝试关闭广告拦截或允许第三方脚本。</span>
        </div>
      </section>
    </main>

    <script>
      // 6 秒检测一次：若 TradingView 的 iframe 没出现，则显示“重新加载”按钮
      function checkTV(){
        const ok = !!document.querySelector('.tradingview-widget-container__widget iframe');
        if(!ok) document.getElementById('tv-fail').style.display='block';
      }
      window.addEventListener('load', ()=> setTimeout(checkTV, 6000));

      // 重新加载：重新注入 TradingView events 脚本（仍然无需任何配置）
      document.getElementById('btn-retry').addEventListener('click', ()=>{
        const box = document.getElementById('tv-box');
        const old = document.getElementById('tv-script');
        if (old) old.remove();
        const s = document.createElement('script');
        s.id = 'tv-script';
        s.type = 'text/javascript';
        s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-events.js';
        s.async = true;
        s.text = JSON.stringify({
          width: "100%",
          height: "760",
          colorTheme: "dark",
          isTransparent: true,
          locale: "ko"   // 需要中文可改为 "zh_CN"
        }, null, 2);
        box.appendChild(s);
        document.getElementById('tv-fail').style.display='none';
        setTimeout(checkTV, 6000);
      });
    </script>
  </body>
</html>
