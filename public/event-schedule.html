<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오늘의 금융 이벤트 | TRAN TRADING LAB</title>
    <meta name="description" content="실시간 경제일정 / 경제지표 캘린더" />
    <meta name="theme-color" content="#0a0b0e" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles/global.css" />

    <style>
      /* 顶部价格滚动条（黑色） */
      #price-tape{position:sticky;top:0;z-index:10000;background:#000;border-bottom:1px solid #151515}
      #price-tape .tradingview-widget-container{max-width:100%}

      /* 兜底导航样式（即使 global.css 没加载也不至于蓝色下划线） */
      .nav{display:flex;gap:18px;align-items:center;padding:10px 16px;background:#0a0b0e;border-bottom:1px solid #151515}
      .nav .brand{margin-right:auto;display:flex;align-items:center;gap:10px;color:#d5d8df;text-decoration:none;font-weight:700}
      .nav .logo{height:22px;width:auto;border-radius:4px}
      .nav a{color:#c2c7d0;text-decoration:none}
      .nav a[aria-current="page"]{color:#fff}

      /* 页面容器 */
      .ttl-page{max-width:1100px;margin:24px auto;padding:16px}
      .ttl-card{border:1px solid #1c1c1c;background:#0b0c10cc;border-radius:14px;padding:16px}
      .ttl-title{margin:6px 0 12px;font-size:1.35rem}
      .ttl-muted{opacity:.65}
      .row{display:flex;gap:12px;flex-wrap:wrap}
      .tabs{display:flex;gap:8px;margin-bottom:12px}
      .tab{padding:8px 12px;border:1px solid #1f2330;background:#0e1117;border-radius:10px;cursor:pointer}
      .tab.active{border-color:#334155;background:#121826}
      .panel{display:none}
      .panel.active{display:block}
      .widget{min-height:720px}
      .tradingview-widget-container, .tradingview-widget-container__widget{width:100%}
      iframe{width:100%;height:720px;border:0;border-radius:10px}
    </style>
  </head>

  <body>
    <!-- 顶部价格滚动条 -->
    <div id="price-tape" aria-label="가격 티커">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
{
  "symbols": [
    { "proName": "FX_IDC:USDKRW",   "title": "USD/KRW" },
    { "proName": "OANDA:USDCAD",    "title": "USD/CAD" },
    { "proName": "OANDA:AUDUSD",    "title": "AUD/USD" },
    { "proName": "OANDA:XAUUSD",    "title": "XAU/USD" },
    { "proName": "BINANCE:BTCUSDT", "title": "BTC/USDT" },
    { "proName": "FOREXCOM:SPXUSD", "title": "S&P 500" },
    { "proName": "FOREXCOM:NSXUSD", "title": "Nasdaq 100" }
  ],
  "showSymbolLogo": true,
  "isTransparent": true,
  "displayMode": "adaptive",
  "colorTheme": "dark",
  "locale": "ko"
}
        </script>
      </div>
    </div>

    <!-- 顶部导航（保持与站内一致；此页是独立静态页，不加载 SPA 脚本） -->
    <nav class="nav" aria-label="Primary">
      <a href="/" class="brand" aria-label="홈으로">
        <img src="/logo.png" alt="TRAN Trading Lab" class="logo" />
        TRAN TRADING LAB
      </a>
      <a href="#/daily-brief">데일리 브리프</a>
      <a href="#/trade-journal">분석 아카이브</a>
      <a href="#/knowledge-lab">지식 연구소</a>
      <a href="#/market-news">마켓 뉴스</a>
      <a href="#/articles">아티클</a>
      <a href="/event-schedule.html" aria-current="page">오늘의 금융 이벤트</a>
      <a href="#/about">About</a>
    </nav>

    <!-- 页面主体 -->
    <main class="ttl-page">
      <section class="ttl-card">
        <h2 class="ttl-title">오늘의 금융 이벤트 <span class="ttl-muted">· 실시간 달력</span></h2>

        <!-- 选项卡：TradingView / 备用日历 -->
        <div class="tabs">
          <button class="tab active" data-tab="tv">TradingView（日历）</button>
          <button class="tab" data-tab="alt">备用日历</button>
        </div>

        <!-- TradingView 经济日历（免配置） -->
        <div id="panel-tv" class="panel active">
          <div class="tradingview-widget-container widget" id="tv-box">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>
{
  "width": "100%",
  "height": "720",
  "colorTheme": "dark",
  "isTransparent": true,
  "locale": "ko"
}
            </script>
          </div>
          <p class="ttl-muted" style="margin-top:10px">
            데이터: TradingView 공개日历（可能有轻微延迟，仅供参考）
          </p>
        </div>

        <!-- 备用：Investing.com 官方公开日历（同样免配置） -->
        <div id="panel-alt" class="panel">
          <iframe
            id="alt-iframe"
            src="https://ec.forexprostools.com/?timeZone=8&lang=1"
            loading="lazy"
            referrerpolicy="no-referrer"
          ></iframe>
          <p class="ttl-muted" style="margin-top:10px">
            备用来源：Investing.com 经济日历（公开嵌入）
          </p>
        </div>
      </section>
    </main>

    <script>
      // 选项卡切换
      document.querySelectorAll('.tab').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
          document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
        });
      });

      // 如果 5 秒内没有成功把 TradingView 的 iframe 挂进来，自动切到备用日历
      window.addEventListener('load', ()=>{
        setTimeout(()=>{
          const ok = !!document.querySelector('.tradingview-widget-container__widget iframe');
          if (!ok) {
            document.querySelector('.tab[data-tab="alt"]').click();
          }
        }, 5000);
      });
    </script>
    <!-- 不要在本页引入 /src/main.js 或其它 SPA 脚本，避免被路由/重绘清空 -->
  </body>
</html>
