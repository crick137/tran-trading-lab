<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 1 - TRAN Trading Lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .video-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 禁用进度条拖动 - 隐藏时间轴 */
        video::-webkit-media-controls-timeline {
            display: none !important;
        }

        video::-webkit-media-controls-current-time-display,
        video::-webkit-media-controls-time-remaining-display {
            display: none !important;
        }

        /* Firefox */
        video::-moz-range-track {
            display: none !important;
        }

        /* 完成界面 */
        .completion-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }

        .completion-screen.show {
            display: flex;
        }

        .checkmark {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d26a, #00ff88);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            animation: scaleIn 0.5s ease-out;
        }

        .checkmark svg {
            width: 50px;
            height: 50px;
            stroke: #fff;
            stroke-width: 3;
            fill: none;
        }

        .completion-text {
            font-size: 2rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 10px;
            animation: fadeIn 0.5s ease-out 0.3s both;
        }

        .completion-subtext {
            font-size: 1rem;
            color: #888;
            animation: fadeIn 0.5s ease-out 0.5s both;
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="video-container">
        <video controls controlsList="nodownload nofullscreen noplaybackrate" disablePictureInPicture preload="metadata"
            playsinline oncontextmenu="return false;">
            <source src="lesson1.mp4" type="video/mp4">
        </video>
    </div>

    <div class="completion-screen" id="completionScreen">
        <div class="checkmark">
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <div class="completion-text">已看完</div>
        <div class="completion-subtext">Lesson 1 完成</div>
    </div>

    <script>
        // 禁止通过键盘快进/快退
        document.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                e.preventDefault();
            }
        });

        // 禁止拖动进度条
        const video = document.querySelector('video');
        const completionScreen = document.getElementById('completionScreen');
        let lastTime = 0;

        video.addEventListener('timeupdate', function () {
            if (!video.seeking) {
                lastTime = video.currentTime;
            }
        });

        video.addEventListener('seeking', function () {
            // 只允许向前跳最多2秒（防止网络延迟导致的微小跳跃）
            if (video.currentTime > lastTime + 2) {
                video.currentTime = lastTime;
            }
        });

        // 视频播放完成时显示完成界面
        video.addEventListener('ended', function () {
            completionScreen.classList.add('show');
        });
    </script>
</body>

</html>
