<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 1 - TRAN Trading Lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .video-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 禁用进度条拖动 - 隐藏时间轴 */
        video::-webkit-media-controls-timeline {
            display: none !important;
        }

        video::-webkit-media-controls-current-time-display,
        video::-webkit-media-controls-time-remaining-display {
            display: none !important;
        }

        /* Firefox */
        video::-moz-range-track {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="video-container">
        <video controls controlsList="nodownload nofullscreen noplaybackrate" disablePictureInPicture preload="metadata"
            playsinline oncontextmenu="return false;">
            <source src="lesson1.mp4" type="video/mp4">
        </video>
    </div>
    <script>
        // 禁止通过键盘快进/快退
        document.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                e.preventDefault();
            }
        });

        // 禁止拖动进度条
        const video = document.querySelector('video');
        let lastTime = 0;

        video.addEventListener('timeupdate', function () {
            if (!video.seeking) {
                lastTime = video.currentTime;
            }
        });

        video.addEventListener('seeking', function () {
            // 只允许向前跳最多2秒（防止网络延迟导致的微小跳跃）
            if (video.currentTime > lastTime + 2) {
                video.currentTime = lastTime;
            }
        });
    </script>
</body>

</html>
