<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TRAN TRADING LAB | 데이터 보드</title>
    <meta name="description" content="TRAN TRADING LAB — 실시간 데이터 보드" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/styles/global.css" />

    <style>
      .data-board { padding: 16px; background-color: #0a0b0e; border-radius: 12px; color: white; }
      .data-board h2 { font-size: 1.5rem; margin-bottom: 10px; }
      .data-board .data-item { display: flex; justify-content: space-between; margin: 10px 0; padding: 10px; border: 1px solid #222; border-radius: 8px; background-color: #151515; }
      .data-board .data-item span { font-weight: bold; }
      .data-board .data-item .value { font-size: 1.2rem; }
      .data-board .data-item .change { color: green; }
      .data-board .data-item .negative { color: red; }
    </style>
  </head>

  <body>
    <a href="#app" class="skip-link">Skip to main content</a>

    <!-- 背景效果画布 -->
    <canvas id="bgfx" data-enabled="true" aria-hidden="true"></canvas>

    <!-- 顶部导航 -->
    <nav class="nav" aria-label="Primary">
      <a href="#/" class="brand" aria-label="홈으로">
        <img src="/logo.png" alt="TRAN Trading Lab" class="logo" />
        TRAN TRADING LAB
      </a>
      <a href="#/daily-brief">데일리 브리프</a>
      <a href="#/trade-journal">분석 아카이브</a>
      <a href="#/knowledge-lab">지식 연구소</a>
      <a href="#/market-news">마켓 뉴스</a>
      <a href="#/articles">아티클</a>
      <a href="#/data-board">데이터 보드</a> <!-- 添加数据板块页面链接 -->
      <a href="#/about">About</a>
    </nav>

    <!-- 数据板块内容 -->
    <main class="container" id="app" aria-live="polite">
      <section class="data-board">
        <h2>실시간 데이터 보드</h2>
        <div id="stock-data" class="data-item">
          <span>주식</span>
          <span class="value" id="stock-value">로딩중...</span>
        </div>
        <div id="crypto-data" class="data-item">
          <span>비트코인</span>
          <span class="value" id="crypto-value">로딩중...</span>
        </div>
        <div id="forex-data" class="data-item">
          <span>USD/KRW</span>
          <span class="value" id="forex-value">로딩중...</span>
        </div>
      </section>
    </main>

    <!-- 数据更新脚本 -->
    <script>
      async function fetchStockData() {
        // 假设使用 API 获取股票数据
        try {
          const response = await fetch('https://api.example.com/stock');
          const data = await response.json();
          document.getElementById('stock-value').textContent = data.price;
        } catch (error) {
          document.getElementById('stock-value').textContent = '데이터를 가져올 수 없습니다.';
        }
      }

      async function fetchCryptoData() {
        // 获取比特币数据
        try {
          const response = await fetch('https://api.example.com/crypto');
          const data = await response.json();
          document.getElementById('crypto-value').textContent = data.price;
        } catch (error) {
          document.getElementById('crypto-value').textContent = '데이터를 가져올 수 없습니다.';
        }
      }

      async function fetchForexData() {
        // 获取外汇数据
        try {
          const response = await fetch('https://api.example.com/forex');
          const data = await response.json();
          document.getElementById('forex-value').textContent = data.price;
        } catch (error) {
          document.getElementById('forex-value').textContent = '데이터를 가져올 수 없습니다.';
        }
      }

      // 页面加载时获取数据
      window.onload = () => {
        fetchStockData();
        fetchCryptoData();
        fetchForexData();
        setInterval(fetchStockData, 60000);  // 每分钟刷新股票数据
        setInterval(fetchCryptoData, 60000);  // 每分钟刷新比特币数据
        setInterval(fetchForexData, 60000);  // 每分钟刷新外汇数据
      };
    </script>
  </body>
</html>
