    <style>

      .ttl-news h3 { margin:0 0 10px; font-size:1.05rem; letter-spacing:.2px }

    <!-- SPA 主要内容 -->
    <main class="container" id="app" aria-live="polite"></main>

    <!-- 新闻流 & 数据板 路由/渲染脚本（前端直连，无需配置） -->
    <script>
      const NEWS_URL   = '/api/news';
      const TG_CHANNEL = ''; // 可选: 'https://t.me/yourchannel'

      async function loadNews() {
        try {
          const r = await fetch(NEWS_URL + '?_=' + Date.now(), { cache: 'no-store' });
          if (!r.ok) throw 0;
          return await r.json();
        } catch { return []; }
      }

      /* ===== 数据板块：零配置公共 API 直连 ===== */
      async function getJSON(url){
        const r = await fetch(url, {cache:'no-store'});
        if(!r.ok) throw 0;
        return r.json();
      }
      async function loadBoardData(){
        const [btc, eth, usd, eur] = await Promise.allSettled([
          getJSON('https://api.coindesk.com/v1/bpi/currentprice/BTC.json'),             // BTC/USD (CoinDesk)
          getJSON('https://api.binance.com/api/v3/ticker/price?symbol=ETHUSDT'),        // ETH/USDT (Binance)
          getJSON('https://open.er-api.com/v6/latest/USD'),                              // USD base -> KRW/JPY
          getJSON('https://open.er-api.com/v6/latest/EUR')                               // EUR base -> USD
        ]);
        const out = {};
        if (btc.status==='fulfilled')
          out['BTC/USDT'] = { price: Number(btc.value?.bpi?.USD?.rate_float)||0, src:'CoinDesk' };
        if (eth.status==='fulfilled')
          out['ETH/USDT'] = { price: Number(eth.value?.price)||0, src:'Binance' };
        if (usd.status==='fulfilled'){
          out['USD/KRW'] = { price: Number(usd.value?.rates?.KRW)||0, src:'open.er-api.com' };
          out['USD/JPY'] = { price: Number(usd.value?.rates?.JPY)||0, src:'open.er-api.com' };
        }
        if (eur.status==='fulfilled')
          out['EUR/USD'] = { price: Number(eur.value?.rates?.USD)||0, src:'open.er-api.com' };
        return out;
      }
      function renderBoard(container, data){
        const rows = Object.entries(data).map(([k,v]) => `
          <div class="card">
            <div class="kv"><b>${k}</b><span class="price">${(v.price||'-').toLocaleString('ko-KR')}</span></div>
            <small class="ttl-muted">SRC: ${v.src}</small>
          </div>`).join('');
        container.innerHTML = `<div class="ttl-grid2">${rows}</div>`;
      }

      /* ===== 路由渲染 ===== */
      async function renderRoute() {
        const hash = location.hash || '#/';

        if (hash.startsWith('#/market-news')) {
          const app = document.getElementById('app');
          if (!app) return;
          app.innerHTML = `
            <section class="ttl-page">
              <h2>마켓 뉴스</h2>
              <p class="ttl-muted">30분마다 업데이트 · 출처 링크 포함</p>
              <div class="ttl-grid">
                <div class="ttl-news">
                  <h3>실시간 스트림</h3>
                  <ul id="ttl-route-news"></ul>
                </div>
                <div class="ttl-news">
                  <h3>공지</h3>
                  <p class="ttl-muted">투자 자문이 아닙니다. 숫자와 시간은 지연/오류가 있을 수 있어 “~ / 대략” 표기를 사용합니다.</p>
                  ${TG_CHANNEL ? `<p><a href="${TG_CHANNEL}" target="_blank">📌 TG에서 실시간 보기</a></p>` : ''}
                </div>
              </div>
            </section>
          `;
          const ul = document.getElementById('ttl-route-news');
          ul.innerHTML = '<li class="ttl-muted">로딩중…</li>';
          const list = await loadNews();
          if (!list.length) { ul.innerHTML = '<li class="ttl-muted">뉴스를 불러올 수 없습니다.</li>'; return; }
          ul.innerHTML = '';
          list.slice(0, 30).forEach(n => {
            const d = new Date(n.isoDate || n.ts || Date.now());
            const when = d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
            const li = document.createElement('li');
            li.innerHTML = `<b>[${when}]</b> ${n.summaryKo} <a href="${n.link}" target="_blank" rel="noreferrer">원문</a>`;
            ul.appendChild(li);
          });
        }
        else if (hash.startsWith('#/data-board')) {
          const app = document.getElementById('app');
          if (!app) return;
          app.innerHTML = `
            <section class="ttl-board">
              <h2>실시간 데이터 보드</h2>
              <p class="ttl-muted">1분마다 자동 갱신</p>
              <div id="board"></div>
            </section>
          `;
          const mount = document.getElementById('board');
          async function refresh(){
            try {
              const d = await loadBoardData();
              renderBoard(mount, d);
            } catch {
              mount.innerHTML = '<p class="ttl-muted">데이터를 불러올 수 없습니다.</p>';
            }
          }
          refresh();
          if (window.ttlBoardTimer) clearInterval(window.ttlBoardTimer);
          window.ttlBoardTimer = setInterval(refresh, 60 * 1000);
        }
        else {
          // 其它路由可按需扩展；这里留空即可
          const app = document.getElementById('app');
          if (app) app.innerHTML = '';
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        renderRoute();
        window.addEventListener('hashchange', renderRoute);
      });
    </script>
