    <!-- 홈 상단: 뉴스 스트림(최근 10개) -->

      <div id="ttl-home-news" class="ttl-news" aria-live="polite">
        <h3>뉴스 스트림 <small class="ttl-muted">(최근 10개)</small></h3>

    </section>

    <!-- SPA 메인 -->
    <main class="container" id="app" aria-live="polite"></main>

    <!-- analyses/index.json 전면 필터 (특정 slug 숨김) -->
    <script>
    (function () {
      const BLOCK = new Set(['2025/10/27','2025-10-27']);
      const RX_INDEX = /\/(api\/)?analyses\/index\.json(?:[?#]|$)/i;

      const _fetch = window.fetch;
      window.fetch = async function (input, init) {
        const res = await _fetch(input, init);
        try {
          const url = (typeof input === 'string' ? input : input?.url) || '';
          if (RX_INDEX.test(url)) {
            const clone = res.clone();
            let data = await clone.json();
            const norm = (x)=> typeof x === 'string' ? x : (x?.slug || x?.id || '');
            const drop = (arr)=> arr.filter(x => !BLOCK.has(norm(x)));
            if (Array.isArray(data)) data = drop(data);
            else if (data && Array.isArray(data.items)) data.items = drop(data.items);

            return new Response(JSON.stringify(data), {
              status: res.status,
              statusText: res.statusText,
              headers: { 'Content-Type':'application/json; charset=utf-8' }
            });
          }
        } catch (e) {}
        return res;
      };

      function removeCards(){
        const rx = /\b2025[\/-]10[\/-]27\b/;
        const WRAPS = 'li,article,.card,.list-item,.item,.row,section,div';
        document.querySelectorAll(WRAPS).forEach(el=>{
          if (rx.test(el.textContent)) (el.closest(WRAPS) || el).remove();
        });
        document.querySelectorAll(
          'a[href*="2025%2F10%2F27"], a[href*="2025/10/27"], a[href*="2025-10-27"]'
        ).forEach(a=>a.style.display='none');
      }
      document.addEventListener('DOMContentLoaded', removeCards);
      new MutationObserver(removeCards).observe(document.documentElement, { childList:true, subtree:true });
    })();
    </script>

    <!-- 뉴스 스트림 렌더 스크립트 -->
    <script>
      const NEWS_URL   = '/api/news';
      const TG_CHANNEL = ''; // 선택사항: 'https://t.me/yourchannel'

      async function loadNews() {
        try {
          const r = await fetch(NEWS_URL + '?_=' + Date.now(), { cache: 'no-store' });
          if (!r.ok) throw 0;
          return await r.json();
        } catch { return []; }
      }

      async function renderHomeNews() {
        const box = document.getElementById('ttl-home-news-list');
        if (!box) return;
        box.innerHTML = '<li class="ttl-muted">로딩중…</li>';
        const list = await loadNews();
        if (!list.length) { box.innerHTML = '<li class="ttl-muted">뉴스를 불러올 수 없습니다.</li>'; return; }
        box.innerHTML = '';
        list.slice(0, 10).forEach(n => {
          const d = new Date(n.isoDate || n.ts || Date.now());
          const when = d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
          const li = document.createElement('li');
          li.innerHTML = `<b>[${when}]</b> ${n.summaryKo} <a href="${n.link}" target="_blank" rel="noreferrer">원문</a>`;
          box.appendChild(li);
        });
      }

      async function renderRoute() {
        const hash = location.hash || '#/';
        if (hash.startsWith('#/market-news')) {
          const app = document.getElementById('app');
          if (!app) return;
          app.innerHTML = `
            <section class="ttl-page">
              <h2>마켓 뉴스</h2>
              <p class="ttl-muted">30분마다 업데이트 · 출처 링크 포함</p>
              <div class="ttl-grid">
                <div class="ttl-news">
                  <h3>실시간 스트림</h3>
                  <ul id="ttl-route-news"></ul>
                </div>
                <div class="ttl-news">
                  <h3>공지</h3>
                  <p class="ttl-muted">투자 자문이 아닙니다. 숫자와 시간은 지연/오류가 있을 수 있어 “~ / 대략” 표기를 사용합니다.</p>
                  ${TG_CHANNEL ? `<p><a href="${TG_CHANNEL}" target="_blank">📌 TG에서 실시간 보기</a></p>` : ''}
                </div>
              </div>
            </section>
          `;
          const ul = document.getElementById('ttl-route-news');
          ul.innerHTML = '<li class="ttl-muted">로딩중…</li>';
          const list = await loadNews();
          if (!list.length) { ul.innerHTML = '<li class="ttl-muted">뉴스를 불러올 수 없습니다.</li>'; return; }
          ul.innerHTML = '';
          list.slice(0, 30).forEach(n => {
            const d = new Date(n.isoDate || n.ts || Date.now());
            const when = d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
            const li = document.createElement('li');
            li.innerHTML = `<b>[${when}]</b> ${n.summaryKo} <a href="${n.link}" target="_blank" rel="noreferrer">원문</a>`;
            ul.appendChild(li);
          });
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        renderHomeNews();
        renderRoute();
        setInterval(renderHomeNews, 5 * 60 * 1000);
        window.addEventListener('hashchange', renderRoute);
      });
    </script>
